# Run with
# GIT_USER="<your name>" GIT_EMAIL="<your email>" FOLDER="/Users/you/code" docker compose up -d

services:
  # Dolt extracted from gastown-sandbox into its own service: it now owns the
  # dolt-data volume exclusively and serves on the compose network. The embedded
  # `dolt sql-server` inside gastown-sandbox MUST be stopped before this comes up
  # (two servers on one data dir corrupts it), and `bd` inside gastown must switch
  # to server mode (TCP dolt:3307) since it no longer has local file access.
  dolt:
    image: dolthub/dolt-sql-server:latest
    container_name: gastown-dolt
    restart: unless-stopped
    # Bypass the image's mysql-style entrypoint (which forces port 3306 + root-auth
    # setup). Run dolt directly, passwordless, matching the sandbox's open server.
    # On every boot, idempotently ensure the `gastown@%` superuser exists (the data
    # dir ships only root@localhost, which rejects network clients) BEFORE starting the
    # server. CREATE USER IF NOT EXISTS = validate, create only when missing.
    entrypoint: ["sh", "-c"]
    command:
      - |
        cd /var/lib/dolt
        dolt sql -q "CREATE USER IF NOT EXISTS 'gastown'@'%'; GRANT ALL PRIVILEGES ON *.* TO 'gastown'@'%' WITH GRANT OPTION;"
        exec dolt sql-server --host=0.0.0.0 --port=3307
    volumes:
      - dolt-data:/var/lib/dolt
    expose:
      - "3307"
    networks:
      - default

  # Postgres: canonical audit log + outbox + read-side projections (feed/activity/quota/rigs).
  # gt-web/gt auto-apply sqlx migrations on boot. Internal-only (expose, never published).
  postgres:
    image: postgres:16-alpine
    container_name: gastown-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastown
      POSTGRES_PASSWORD: gastown
      POSTGRES_DB: gastown
    volumes:
      - gt-pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - default

  # Rust read-side API (gt-web). Compose builds the binary from apps/api/Dockerfile.
  # Reads orchestrator state from the `hq` Dolt DB; serves /api + SSE + /health + /readyz.
  # Replaces the retired Go dashboard as the gastown.codecsrayo.com backend.
  gt-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gastown-gt-api
    restart: unless-stopped
    command: ["gt-web"]
    depends_on:
      - dolt
      - postgres
    environment:
      GT_WEB_BIND: 0.0.0.0:8787
      # Fail-closed: refuses to start without a bearer secret for /api/*.
      GT_WEB_TOKEN: ${GT_WEB_TOKEN:?set GT_WEB_TOKEN in .env}
      GT_DOLT_URL: mysql://gastown@dolt:3307/hq
      GT_PG_AUDIT_URL: postgres://gastown:gastown@postgres:5432/gastown
      GT_EVENT_LOG: /var/lib/gastown/events.jsonl
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      OTEL_SERVICE_NAME: gt-api
      # GT_TOWN_ROOT (hq-fe-api-r.8) intentionally unset in compose: enabling
      # `/api/worktrees` against the host repo needs a `/home/nixos:/home/nixos:ro`
      # bind plus a UID switch (container user is gastown 999; host repo is 0700
      # nixos:1000) — both deploy-edge decisions deferred. Run gt-web host-side
      # (`GT_TOWN_ROOT=/home/nixos/gastown gt-web`) for live worktree data today.
    volumes:
      - gt-eventlog:/var/lib/gastown
    expose:
      - "8787"
    networks:
      - default
      - traefik-public
    # Inherits the gastown.codecsrayo.com router from the retired Go dashboard — same
    # domain + cert, loadbalancer now points at gt-web on 8787.
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
      - traefik.http.routers.gastown-http.rule=Host(`${GASTOWN_DOMAIN:-gastown.codecsrayo.com}`)
      - traefik.http.routers.gastown-http.entrypoints=web
      - traefik.http.routers.gastown-http.middlewares=gastown-https
      - traefik.http.routers.gastown.rule=Host(`${GASTOWN_DOMAIN:-gastown.codecsrayo.com}`)
      - traefik.http.routers.gastown.entrypoints=websecure
      - traefik.http.routers.gastown.tls=true
      - traefik.http.routers.gastown.tls.certresolver=netlify
      - traefik.http.services.gastown.loadbalancer.server.port=8787
      - traefik.http.middlewares.gastown-https.redirectscheme.scheme=https

  # Rust orchestrator daemon (composition root): actor fan-out, PG outbox pipeline, live
  # daemons (refinery MERGE_READY watcher, witness escalation, deacon/e-stop drain), and
  # REAL polecat spawn — `claude` agents inside tmux. Needs the full agent runtime image
  # (claude/tmux/git/bd/dolt), built by Dockerfile.orchestrator onto the gastown-gastown base.
  # Shares the event-log volume with gt-api (both append events.jsonl, per the daemon design).
  # GT_POLECAT_CMD overridable to a no-op for safe validation before unleashing on live beads.
  gt:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.orchestrator
    image: gastown-gt-orch:latest
    container_name: gastown-gt
    restart: unless-stopped
    # Bypass the base image's docker-entrypoint.sh (Go town bootstrap: bd init / dashboard).
    # gt-rs is self-contained; tini reaps the tmux polecat children + forwards SIGTERM.
    entrypoint: ["tini", "--", "gt-rs"]
    depends_on:
      - dolt
      - postgres
    environment:
      GT_DOLT_URL: mysql://gastown@dolt:3307/hq
      GT_PG_AUDIT_URL: postgres://gastown:gastown@postgres:5432/gastown
      GT_EVENT_LOG: /var/lib/gastown/events.jsonl
      GT_RIG_PATH: /gt
      GT_BIN: /usr/local/bin/gt-rs
      GT_POLECAT_CMD: ${GT_POLECAT_CMD:-claude}
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      OTEL_SERVICE_NAME: gt
      GT_METRICS_BIND: 0.0.0.0:9100
    expose:
      - "9100"
    volumes:
      - ${FOLDER:-/home/nixos/gastown}:/gt
      - agent-home:/home/agent
      - gt-eventlog:/var/lib/gastown
      - ${HOST_SSH_DIR:-${HOME}/.ssh}:/host-ssh:ro
    networks:
      - default

  # gt-mcp: MCP tool/resource server over streamable-HTTP (rmcp). Same slim image as gt-api
  # (carries gt-mcp too). Reads orchestrator state from Dolt `hq` + PG; shares the event log.
  # Per-actor scope from mcp-scope.toml (no hardcoded admin); GT_MCP_ACTOR=mcp-local = full
  # access for dev. Published on 127.0.0.1:8765 for host MCP clients (gt-mcp-cli / Claude Code).
  gt-mcp:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gastown-gt-mcp
    restart: unless-stopped
    command: ["gt-mcp"]
    depends_on:
      - dolt
      - postgres
    environment:
      GT_MCP_TRANSPORT: http
      GT_MCP_HTTP_BIND: 0.0.0.0:8765
      GT_DOLT_URL: mysql://gastown@dolt:3307/hq
      GT_PG_AUDIT_URL: postgres://gastown:gastown@postgres:5432/gastown
      GT_EVENT_LOG: /var/lib/gastown/events.jsonl
      GT_MCP_ACTOR: ${GT_MCP_ACTOR:-mcp-local}
      GT_MCP_SCOPE_CONFIG: /etc/gastown/mcp-scope.toml
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      OTEL_SERVICE_NAME: gt-mcp
    volumes:
      - gt-eventlog:/var/lib/gastown
    ports:
      - "127.0.0.1:8765:8765"
    networks:
      - default

  # Prometheus: scrapes /metrics from gt-web (and future bins). Internal-only —
  # no host port, no traefik label; Grafana reads it on the compose network.
  # Config under deploy/observability/prometheus/.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: gastown-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - gt-prometheus:/prometheus
    expose:
      - "9090"
    networks:
      - default

  # Tempo: OTLP receiver + local trace store. Sinks spans exported by gt-telemetry
  # (gt-api/gt/gt-mcp set OTEL_EXPORTER_OTLP_ENDPOINT below). Internal-only on the
  # compose network; Grafana proxies queries against it.
  tempo:
    image: grafana/tempo:2.6.0
    container_name: gastown-tempo
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - gt-tempo:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    networks:
      - default

  # Grafana: dashboards + datasources provisioned from deploy/observability/grafana/.
  # Default datasource = Prometheus; Postgres-gastown reads audit/outbox/projections
  # tables. Bound to host loopback on 3000 for local validation; add a traefik label
  # block below to expose publicly (commented out — opt-in per environment).
  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: gastown-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - postgres
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.gastown.codecsrayo.com}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.gastown.codecsrayo.com}
      GF_SERVER_ENFORCE_DOMAIN: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - gt-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
      - traefik.http.routers.gastown-grafana-http.rule=Host(`${GRAFANA_DOMAIN:-grafana.gastown.codecsrayo.com}`)
      - traefik.http.routers.gastown-grafana-http.entrypoints=web
      - traefik.http.routers.gastown-grafana-http.middlewares=gastown-grafana-https
      - traefik.http.routers.gastown-grafana.rule=Host(`${GRAFANA_DOMAIN:-grafana.gastown.codecsrayo.com}`)
      - traefik.http.routers.gastown-grafana.entrypoints=websecure
      - traefik.http.routers.gastown-grafana.tls=true
      - traefik.http.routers.gastown-grafana.tls.certresolver=netlify
      - traefik.http.services.gastown-grafana.loadbalancer.server.port=3000
      - traefik.http.middlewares.gastown-grafana-https.redirectscheme.scheme=https

networks:
  traefik-public:
    name: ${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
    external: true

volumes:
  agent-home:
  dolt-data:
  gt-eventlog:
  gt-pgdata:
  gt-prometheus:
  gt-grafana:
  gt-tempo:
