# Run with
# GIT_USER="<your name>" GIT_EMAIL="<your email>" FOLDER="/Users/you/code" docker compose up -d

services:
  gastown:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastown-sandbox
    stdin_open: false
    restart: unless-stopped
    tty: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - NET_RAW
    environment:
      IS_SANDBOX: 1
      TZ: ${TZ:-America/Bogota}
      GT_DOLT_TIME_ZONE: ${TZ:-America/Bogota}
      GIT_USER: ${GIT_USER:-TestUser}
      GIT_EMAIL: ${GIT_EMAIL:-test@example.com}
      # Dashboard runs as a decoupled background child of the entrypoint
      # (see docker-entrypoint.sh). Set GT_DASHBOARD_AUTOSTART=0 to boot the
      # town without the dashboard, e.g. to shed its CPU cost.
      GT_DASHBOARD_AUTOSTART: ${GT_DASHBOARD_AUTOSTART:-1}
      GT_DASHBOARD_BIND: ${GT_DASHBOARD_BIND:-0.0.0.0}
      GT_DASHBOARD_PORT: ${GT_DASHBOARD_PORT:-8080}
    volumes:
      # FOLDER must be defined in .env file, e.g. FOLDER=/home/user
      # or provided as an environment variable when running docker compose,
      # e.g. FOLDER=/home/user docker compose up
      - agent-home:/home/agent
      - ${FOLDER}:/gt
      # Dolt data on a proper ext4 volume (not the macOS bind mount) to
      # avoid journal corruption from VirtioFS fsync semantics.
      - dolt-data:/gt/.dolt-data
      # Host SSH keys (read-only). Entrypoint copies into agent home so
      # git push/pull to private remotes works inside the sandbox.
      - ${HOST_SSH_DIR:-${HOME}/.ssh}:/host-ssh:ro
    expose:
      - "8080"
    # PID1 keep-alive: the container lifecycle no longer depends on the
    # dashboard (started as a background child by docker-entrypoint.sh).
    command: ["sleep", "infinity"]
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
      - traefik.http.routers.gastown-http.rule=Host(`${GASTOWN_DOMAIN:-gastown.codecsrayo.com}`)
      - traefik.http.routers.gastown-http.entrypoints=web
      - traefik.http.routers.gastown-http.middlewares=gastown-https
      - traefik.http.routers.gastown.rule=Host(`${GASTOWN_DOMAIN:-gastown.codecsrayo.com}`)
      - traefik.http.routers.gastown.entrypoints=websecure
      - traefik.http.routers.gastown.tls=true
      - traefik.http.routers.gastown.tls.certresolver=netlify
      - traefik.http.services.gastown.loadbalancer.server.port=8080
      - traefik.http.middlewares.gastown-https.redirectscheme.scheme=https

    # Exec into the container with: docker compose exec gastown zsh

networks:
  traefik-public:
    name: ${TRAEFIK_PUBLIC_NETWORK:-proyectos-bi-quare}
    external: true

volumes:
  agent-home:
  dolt-data:
