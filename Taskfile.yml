# https://taskfile.dev
#
# Gas Town Rust stack. The Go monolith (`gastown` service, Makefile, gt-proxy-server/client)
# was retired 2026-05-29 in favor of five compose services driven by the Rust workspace at
# `apps/api/` (per `apps/api/docs/deployment/01-services.md`):
#
#   - dolt           — embedded Dolt SQL server (port 3307, internal)
#   - postgres       — audit log + outbox + projections
#   - gt-api         — Rust read-side HTTP (`gt-web` binary, gastown.codecsrayo.com)
#   - gt             — orchestrator daemon (`gt-rs` binary, real polecat spawn via tmux)
#   - gt-mcp         — MCP tool/resource server (streamable-HTTP on 127.0.0.1:8765)
#
# Two images: `apps/api/Dockerfile` ships gt-web + gt-mcp; `apps/api/Dockerfile.orchestrator`
# ships gt-rs + tmux/claude/bd/dolt for the gt service. Cargo workspace is the source of
# truth; `task hot-deploy*` rebuilds the relevant image and recreates the container so the
# new binary lands. Dolt + PG stay up across deploys (data volumes survive).

version: '3'

vars:
  COMPOSE: docker compose
  CARGO_DIR: apps/api
  RUST_SERVICES: gt-api gt-mcp gt

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Cargo (host): build + test the workspace without touching containers.
  # ---------------------------------------------------------------------------

  build:
    desc: Cargo release build of every Rust binary (gt, gt-web, gt-mcp)
    dir: '{{.CARGO_DIR}}'
    cmds:
      - cargo build --release -p gt -p gt-web -p gt-mcp

  test:
    desc: Run the full Rust test suite
    dir: '{{.CARGO_DIR}}'
    cmds:
      - cargo test --workspace

  fmt:
    desc: cargo fmt across the workspace
    dir: '{{.CARGO_DIR}}'
    cmds:
      - cargo fmt --all

  clippy:
    desc: cargo clippy with -D warnings
    dir: '{{.CARGO_DIR}}'
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Compose lifecycle.
  # ---------------------------------------------------------------------------

  image-build:
    desc: Build the Rust service images (slim + orchestrator)
    cmds:
      - '{{.COMPOSE}} build {{.RUST_SERVICES}}'

  up:
    desc: Start the full stack detached
    cmds:
      - '{{.COMPOSE}} up -d'

  down:
    desc: Stop + remove all containers (volumes survive)
    cmds:
      - '{{.COMPOSE}} down'

  ps:
    desc: Show container status
    cmds:
      - '{{.COMPOSE}} ps'

  logs:
    desc: 'Tail logs (SERVICE=gt|gt-api|gt-mcp|dolt|postgres, default: all)'
    vars:
      SERVICE: '{{.SERVICE | default ""}}'
    cmds:
      - '{{.COMPOSE}} logs -f {{.SERVICE}}'

  restart:
    desc: 'Restart a service without rebuilding (SERVICE=gt|gt-api|gt-mcp, default: gt)'
    vars:
      SERVICE: '{{.SERVICE | default "gt"}}'
    cmds:
      - '{{.COMPOSE}} restart {{.SERVICE}}'

  shell:
    desc: 'Exec bash inside a container (SERVICE=gt|gt-api|gt-mcp, default: gt)'
    vars:
      SERVICE: '{{.SERVICE | default "gt"}}'
    cmds:
      - '{{.COMPOSE}} exec {{.SERVICE}} bash'

  # ---------------------------------------------------------------------------
  # Hot deploy: rebuild the relevant image and recreate the container.
  # Cheap services (gt-api, gt-mcp) share the slim image and rebuild fast.
  # `gt` recompiles inside the orchestrator image (heavier — full agent runtime).
  # ---------------------------------------------------------------------------

  deploy-gt-api:
    desc: Rebuild + recreate gt-api (gt-web binary)
    cmds:
      - '{{.COMPOSE}} build gt-api'
      - '{{.COMPOSE}} up -d --force-recreate gt-api'

  deploy-gt-mcp:
    desc: Rebuild + recreate gt-mcp (gt-mcp binary)
    cmds:
      - '{{.COMPOSE}} build gt-mcp'
      - '{{.COMPOSE}} up -d --force-recreate gt-mcp'

  deploy-gt:
    desc: Rebuild + recreate gt orchestrator (gt-rs binary)
    cmds:
      - '{{.COMPOSE}} build gt'
      - '{{.COMPOSE}} up -d --force-recreate gt'

  hot-deploy:
    desc: Rebuild + recreate every Rust service. Dolt + PG stay up.
    cmds:
      - task: deploy-gt-api
      - task: deploy-gt-mcp
      - task: deploy-gt

  rebuild:
    desc: Full image rebuild + recreate every Rust service (alias for hot-deploy)
    cmds:
      - task: hot-deploy
