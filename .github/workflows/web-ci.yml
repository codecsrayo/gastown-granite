# Frontend CI gate (hq-fe-build.8). Runs on every PR + push touching `apps/web/**` so a
# broken SvelteKit build, type error, lint regression, or failing vitest blocks merge before
# it lands on main. `test:e2e` (Playwright) stays out of this gate — it lives in
# `e2e.yml` once `hq-fe-build.7` plumbs the browser stack.
name: web-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: pnpm check + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # pnpm before setup-node so the `cache: pnpm` line below can find the binary.
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: pnpm check

      # Skip the prettier half of `pnpm lint` until the prettier 3.8 + prettier-plugin-svelte
      # 3.5 compat issue lands (TypeError `getVisitorKeys is not a function`). eslint already
      # catches the substantive lint issues; reformatting is a separate concern.
      - name: Lint (eslint)
        run: pnpm exec eslint .

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build SPA
        run: pnpm build
