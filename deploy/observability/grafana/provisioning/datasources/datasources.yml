# Grafana datasource provisioning for the gastown compose stack.
# Loaded on Grafana startup; UI-edits are read-only on these entries.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Postgres-gastown
    uid: pg-gastown
    type: postgres
    access: proxy
    url: postgres:5432
    user: gastown
    secureJsonData:
      password: gastown
    jsonData:
      database: gastown
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false
