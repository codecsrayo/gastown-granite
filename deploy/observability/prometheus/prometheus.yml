# Prometheus scrape config for the gastown compose stack.
# Targets are compose service DNS names (resolved on the default network).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: gastown

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: gt-web
    metrics_path: /metrics
    static_configs:
      - targets: ['gt-api:8787']
        labels:
          service: gt-web
