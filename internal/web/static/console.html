<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Gas Town Console</title>
    <!-- Same xterm.js / addon stack as the dashboard so the popped-out
         terminal feels identical to the embedded one. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
    <script src="/static/terminal-attach.js?v=1"></script>
    <style>
        :root {
            --bg: #0f1419;
            --header: #1a1f26;
            --border: #2d363f;
            --fg: #e6e1cf;
            --muted: #6c7680;
            --red: #f07178;
            --blue: #59c2ff;
            --green: #c2d94c;
        }
        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
            height: 100vh;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .console-header {
            background: var(--header);
            border-bottom: 1px solid var(--border);
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .console-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .console-status {
            font-size: 0.7rem;
            color: var(--muted);
        }
        .console-status.live   { color: var(--green); }
        .console-status.warn   { color: var(--red); }
        .console-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 3px 10px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.75rem;
            line-height: 1;
        }
        .console-btn:hover  { background: rgba(89, 194, 255, 0.15); border-color: var(--blue); }
        .console-btn.danger:hover { background: var(--red); color: #fff; border-color: var(--red); }
        #terminal {
            flex: 1 1 auto;
            min-height: 0;
            padding: 4px;
            background: #000;
            overflow: hidden;
        }
        #terminal .xterm,
        #terminal .xterm-viewport,
        #terminal .xterm-screen {
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div class="console-header">
        <span class="console-title" id="console-title">Console</span>
        <span class="console-status" id="console-status">connecting…</span>
        <button class="console-btn" id="merge-btn" title="Send this console back to the dashboard tabs">⇲ Merge</button>
        <button class="console-btn danger" id="close-btn" title="Close">✕</button>
    </div>
    <div id="terminal"></div>

    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var sessionName = params.get('session') || '';
        var label = params.get('label') || sessionName;
        var ephemeral = sessionName.indexOf('gt-console-') === 0;

        if (!sessionName) {
            document.getElementById('console-title').textContent = 'No session specified';
            return;
        }
        document.getElementById('console-title').textContent = label;
        document.title = 'gt: ' + label;

        var statusEl = document.getElementById('console-status');
        function setStatus(text, level) {
            statusEl.textContent = text === 'live' ? 'live' : text;
            statusEl.className = 'console-status ' + (level === 'ok' ? 'live' : (level === 'warn' ? 'warn' : ''));
        }

        // All xterm + WebSocket + wire-protocol plumbing lives in the
        // shared factory (terminal-attach.js); the popup only wires the
        // header chrome (title, status, merge, close).
        var attach = window.GTTerminalAttach.create({
            sessionName: sessionName,
            onStatus: setStatus,
            onTitle: function(title) { document.title = title; },
        });
        attach.mount(document.getElementById('terminal'));

        // Merge back into the dashboard via BroadcastChannel (same origin).
        var channel = null;
        try { channel = new BroadcastChannel('gastown-console'); } catch (e) {}
        document.getElementById('merge-btn').addEventListener('click', function() {
            if (channel) {
                channel.postMessage({
                    type:      'merge',
                    session:   sessionName,
                    label:     label,
                    ephemeral: ephemeral,
                });
            }
            attach.close();
            window.close();
        });

        // Close: tear down the attach; reap the tmux session if ephemeral.
        // sendBeacon survives the unload that follows window.close().
        function closeAndMaybeKill() {
            attach.close();
            if (ephemeral) {
                navigator.sendBeacon('/api/session/kill?session=' + encodeURIComponent(sessionName));
            }
        }
        document.getElementById('close-btn').addEventListener('click', function() {
            closeAndMaybeKill();
            window.close();
        });
        window.addEventListener('beforeunload', closeAndMaybeKill);
    })();
    </script>
</body>
</html>
