<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Gas Town Console</title>
    <!-- Same xterm.js / addon stack as the dashboard so the popped-out
         terminal feels identical to the embedded one. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
    <style>
        :root {
            --bg: #0f1419;
            --header: #1a1f26;
            --border: #2d363f;
            --fg: #e6e1cf;
            --muted: #6c7680;
            --red: #f07178;
            --blue: #59c2ff;
            --green: #c2d94c;
        }
        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
            height: 100vh;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .console-header {
            background: var(--header);
            border-bottom: 1px solid var(--border);
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .console-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .console-status {
            font-size: 0.7rem;
            color: var(--muted);
        }
        .console-status.live   { color: var(--green); }
        .console-status.warn   { color: var(--red); }
        .console-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 3px 10px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.75rem;
            line-height: 1;
        }
        .console-btn:hover  { background: rgba(89, 194, 255, 0.15); border-color: var(--blue); }
        .console-btn.danger:hover { background: var(--red); color: #fff; border-color: var(--red); }
        #terminal {
            flex: 1 1 auto;
            min-height: 0;
            padding: 4px;
            background: #000;
            overflow: hidden;
        }
        #terminal .xterm,
        #terminal .xterm-viewport,
        #terminal .xterm-screen {
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div class="console-header">
        <span class="console-title" id="console-title">Console</span>
        <span class="console-status" id="console-status">connecting…</span>
        <button class="console-btn" id="merge-btn" title="Send this console back to the dashboard tabs">⇲ Merge</button>
        <button class="console-btn danger" id="close-btn" title="Close">✕</button>
    </div>
    <div id="terminal"></div>

    <script>
    (function() {
        // ---- Parse URL params ----------------------------------------
        var params = new URLSearchParams(window.location.search);
        var sessionName = params.get('session') || '';
        var label = params.get('label') || sessionName;
        var ephemeral = sessionName.indexOf('gt-console-') === 0;

        if (!sessionName) {
            document.getElementById('console-title').textContent = 'No session specified';
            return;
        }
        document.getElementById('console-title').textContent = label;
        document.title = 'gt: ' + label;

        // ---- xterm setup --------------------------------------------
        var term = new Terminal({
            fontFamily: 'monospace',
            fontSize: 13,
            cursorBlink: true,
            convertEol: false,
            allowProposedApi: true,
            scrollback: 50000,
            scrollOnUserInput: true,
        });
        var fit = null;
        if (window.FitAddon && window.FitAddon.FitAddon) {
            fit = new window.FitAddon.FitAddon();
            term.loadAddon(fit);
        }
        if (window.WebLinksAddon && window.WebLinksAddon.WebLinksAddon) {
            term.loadAddon(new window.WebLinksAddon.WebLinksAddon());
        }
        term.open(document.getElementById('terminal'));
        if (fit) { try { fit.fit(); } catch (e) {} }

        // ---- WebSocket attach ---------------------------------------
        // Same wire protocol as the dashboard's session_attach.go path.
        var ws = null;
        var userClosed = false;
        var retryDelay = 500;
        var statusEl = document.getElementById('console-status');

        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusEl.className = 'console-status ' + (cls || '');
        }

        function sendCmd(c, payload) {
            if (!ws || ws.readyState !== 1) return;
            var enc;
            if (typeof payload === 'string') enc = new TextEncoder().encode(payload);
            else if (payload) enc = payload;
            else enc = new Uint8Array(0);
            var out = new Uint8Array(enc.length + 1);
            out[0] = c.charCodeAt(0);
            out.set(enc, 1);
            ws.send(out);
        }
        function sendResize() {
            if (!term || !ws || ws.readyState !== 1) return;
            sendCmd('1', JSON.stringify({ cols: term.cols, rows: term.rows }));
        }

        function connect() {
            var proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(proto + '//' + window.location.host + '/api/session/attach?session=' + encodeURIComponent(sessionName));
            ws.binaryType = 'arraybuffer';
            ws.onopen = function() {
                setStatus('live', 'live');
                retryDelay = 500;
                sendResize();
            };
            ws.onmessage = function(ev) {
                var bytes = typeof ev.data === 'string'
                    ? new TextEncoder().encode(ev.data)
                    : new Uint8Array(ev.data);
                if (bytes.length === 0) return;
                var cmd = String.fromCharCode(bytes[0]);
                var payload = bytes.subarray(1);
                if (cmd === '0') {
                    term.write(payload);
                } else if (cmd === '1') {
                    var title = new TextDecoder().decode(payload);
                    document.title = title;
                }
            };
            ws.onclose = function() {
                if (userClosed) { setStatus('closed'); return; }
                setStatus('reconnecting…', 'warn');
                retryDelay = Math.min(30000, retryDelay * 2);
                setTimeout(connect, retryDelay);
            };
            ws.onerror = function() {
                if (!userClosed) setStatus('ws error', 'warn');
            };
        }

        // Force-route Ctrl+C/Z/\/D into the PTY (xterm would otherwise
        // bubble them to the browser as Copy / etc.).
        term.attachCustomKeyEventHandler(function(ev) {
            if (ev.type !== 'keydown') return true;
            if (!(ev.ctrlKey || ev.metaKey) || ev.shiftKey || ev.altKey) return true;
            var byte = null;
            switch (ev.key) {
                case 'c': case 'C': byte = '\x03'; break;
                case 'z': case 'Z': byte = '\x1a'; break;
                case '\\':          byte = '\x1c'; break;
                case 'd': case 'D': byte = '\x04'; break;
            }
            if (!byte) return true;
            if (byte === '\x03' && term.hasSelection && term.hasSelection()) return true;
            sendCmd('0', byte);
            ev.preventDefault();
            return false;
        });
        term.onData(function(data) { sendCmd('0', data); });

        // Resize: xterm fit on every viewport change.
        var resizeHandler = function() {
            if (fit) { try { fit.fit(); } catch (e) {} }
            sendResize();
        };
        window.addEventListener('resize', resizeHandler);

        // ---- Merge back into dashboard via BroadcastChannel ---------
        // Both windows live on the same origin, so we can use
        // BroadcastChannel to nudge the parent dashboard to re-add this
        // session as a tab. The popup then closes itself.
        var channel = null;
        try { channel = new BroadcastChannel('gastown-console'); } catch (e) {}

        document.getElementById('merge-btn').addEventListener('click', function() {
            if (channel) {
                channel.postMessage({
                    type:      'merge',
                    session:   sessionName,
                    label:     label,
                    ephemeral: ephemeral,
                });
            }
            userClosed = true;
            if (ws) { try { ws.close(); } catch (e) {} }
            window.close();
        });

        // ---- Close button: tear down + kill if ephemeral ------------
        function closeAndMaybeKill() {
            userClosed = true;
            if (ws) { try { ws.close(); } catch (e) {} }
            if (ephemeral) {
                // sendBeacon survives the page unload that follows.
                navigator.sendBeacon('/api/session/kill?session=' + encodeURIComponent(sessionName));
            }
        }
        document.getElementById('close-btn').addEventListener('click', function() {
            closeAndMaybeKill();
            window.close();
        });
        window.addEventListener('beforeunload', closeAndMaybeKill);

        connect();
        setTimeout(function() { term.focus(); }, 100);
    })();
    </script>
</body>
</html>
