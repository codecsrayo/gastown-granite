[package]
name = "gt-notify"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# hq-mysw — Notifier PORT. The domain defines the port + the notification vocabulary + the
# signal→channel routing policy (which signals warrant mail vs feed-only). Adapters live at
# the edge (`bins/`): the real bead-backed mail sender, the in-process fake for tests. This
# crate must NOT depend on any mail/transport crate — that is the whole point of the port.
[dependencies]
gt-events = { path = "../../kernel/gt-events" }
serde.workspace = true
