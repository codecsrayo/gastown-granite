[package]
name = "gt-wisp"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# Port of internal/wisp (ephemeral memory with per-kind TTL) + the reaper's compaction
# decision logic (internal/reaper). Self-contained domain (hq-t9vt / paso 9.C): defines the
# WispRepository port + an in-memory adapter; the Dolt adapter lives in gt-store-dolt and the
# scan/reap/purge job lives in bins/gt-reaper, mirroring the gt-merge isolation rule.
[dependencies]
gt-events = { path = "../../../kernel/gt-events" }
time.workspace = true
serde.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
