[package]
name = "gt-sheriff"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
gt-events = { path = "../../../kernel/gt-events" }
gt-channel = { path = "../../../kernel/gt-channel" }
# hq-evks (Paso 9.B) shipped the canonical `Plugin` trait + relay. SheriffPlugin impls it
# from this crate so the composition root can register Sheriff in the plugin chain.
gt-plugin = { path = "../../../kernel/gt-plugin" }
# `Plugin::on_event` takes `&EventRecord`; needed in the trait impl signature.
gt-audit = { path = "../../../kernel/gt-audit" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# The Plugin trait is `#[async_trait]` (the one place in the kernel where `dyn` is allowed).
async-trait.workspace = true

[dev-dependencies]
# Replay gate: round-trips Envelope -> EventRecord -> SheriffEvent through the audit log.
ulid.workspace = true
