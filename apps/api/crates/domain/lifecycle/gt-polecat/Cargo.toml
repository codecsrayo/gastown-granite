[package]
name = "gt-polecat"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
gt-events = { path = "../../../kernel/gt-events" }
gt-agent = { path = "../gt-agent" }
tokio.workspace = true
serde.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-util` enables `#[tokio::test(start_paused = true)]` for the supervise_daemon tests
# so backoff sleeps auto-advance instead of blocking the test thread.
tokio = { workspace = true, features = ["test-util"] }
