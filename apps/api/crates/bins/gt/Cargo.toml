[package]
name = "gt"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# The composition root: the ONE crate allowed to know every domain and wire them
# together (docs/01-architecture.md, layer `bins/`). The library holds the wiring + the
# `GtEvent`/`GtState` unifier; `main.rs` is the thin boot that owns the single tokio runtime.
[lib]
name = "gt_root"
path = "src/lib.rs"

[[bin]]
name = "gt"
path = "src/main.rs"

[dependencies]
# Kernel: contracts + transports + the Dolt-port repo + the type-erased log/replay.
gt-events = { path = "../../kernel/gt-events" }
gt-bus = { path = "../../kernel/gt-bus" }
gt-audit = { path = "../../kernel/gt-audit" }
gt-beads = { path = "../../kernel/gt-beads" }
gt-telemetry = { path = "../../kernel/gt-telemetry" }
# Observer plugin chain (hq-evks): `root::spawn_plugin_relay` wires it onto the broadcast.
gt-plugin = { path = "../../kernel/gt-plugin" }
# Every domain — only the composition root is allowed this fan-in.
gt-agent = { path = "../../domain/gt-agent" }
gt-scheduling = { path = "../../domain/gt-scheduling" }
gt-patrol = { path = "../../domain/gt-patrol" }
gt-merge = { path = "../../domain/gt-merge" }
gt-quota = { path = "../../domain/gt-quota" }
gt-orchestration = { path = "../../domain/gt-orchestration" }
# hq-92z9 Paso 9.D — Sheriff watchdog Plugin (first role fill on top of scaffolding).
gt-sheriff = { path = "../../domain/gt-sheriff" }
# Pure consumer projection of the audit log; the root folds it into `GtState.feed`.
gt-feed = { path = "../../domain/gt-feed" }
# Real persistence adapters wired in by the bin when env URLs are set; otherwise the bin
# falls back to the in-memory port for host runs without Dolt/Postgres.
gt-store-dolt = { path = "../../kernel/gt-store-dolt" }
gt-store-pg = { path = "../../kernel/gt-store-pg" }
# `signal` (ctrl_c) is bin-only; the workspace tokio set stays minimal for the libs.
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true

[dev-dependencies]
ulid.workspace = true
serde_json.workspace = true
