[package]
name = "gt"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# The composition root: the ONE crate allowed to know every domain and wire them
# together (docs/01-architecture.md, layer `bins/`). The library holds the wiring + the
# `GtEvent`/`GtState` unifier; `main.rs` is the thin boot that owns the single tokio runtime.
[lib]
name = "gt_root"
path = "src/lib.rs"

[[bin]]
name = "gt"
path = "src/main.rs"

[dependencies]
# Kernel: contracts + transports + the Dolt-port repo + the type-erased log/replay.
gt-events = { path = "../../kernel/gt-events" }
gt-bus = { path = "../../kernel/gt-bus" }
gt-audit = { path = "../../kernel/gt-audit" }
gt-beads = { path = "../../kernel/gt-beads" }
gt-telemetry = { path = "../../kernel/gt-telemetry" }
# Observer plugin chain (hq-evks): `root::spawn_plugin_relay` wires it onto the broadcast.
gt-plugin = { path = "../../kernel/gt-plugin" }
# Every domain — only the composition root is allowed this fan-in.
gt-agent = { path = "../../domain/lifecycle/gt-agent" }
gt-scheduling = { path = "../../domain/orchestration/gt-scheduling" }
gt-patrol = { path = "../../domain/orchestration/gt-patrol" }
gt-merge = { path = "../../domain/orchestration/gt-merge" }
gt-quota = { path = "../../domain/orchestration/gt-quota" }
gt-orchestration = { path = "../../domain/orchestration/gt-orchestration" }
# hq-mc72.12.30 — rig catalog actor wired into the composition root; gt-mcp drives it.
gt-rig = { path = "../../domain/platform/gt-rig" }
# hq-92z9 Paso 9.D — Mayor orchestration-loop role (delegations actor).
gt-mayor = { path = "../../domain/roles/gt-mayor" }
# hq-92z9 Paso 9.D — Sheriff watchdog Plugin (first role fill on top of scaffolding).
gt-sheriff = { path = "../../domain/roles/gt-sheriff" }
# hq-92z9 Paso 9.D — Deacon drain coordination (third role fill).
gt-deacon = { path = "../../domain/roles/gt-deacon" }
# hq-92z9 Paso 9.D — Refinery merge-ready projection (fourth role fill).
gt-refinery = { path = "../../domain/roles/gt-refinery" }
# hq-92z9 Paso 9.D — Witness escalation observer (per-role fill on top of scaffolding).
gt-witness = { path = "../../domain/roles/gt-witness" }
# Pure consumer projection of the audit log; the root folds it into `GtState.feed`.
gt-feed = { path = "../../domain/platform/gt-feed" }
# hq-63az Paso 9.E — polecat lifecycle + GT_HOOK_BEAD hooks; the sling edge pins the bead.
gt-polecat = { path = "../../domain/lifecycle/gt-polecat" }
# hq-mc72.12 C2 — file-backed mailbox for the supervised MERGE_READY refinery daemon.
gt-channel = { path = "../../kernel/gt-channel" }
# hq-mysw Paso 9.F — Notifier PORT. The root injects an `Arc<dyn Notifier>` (real bead-backed
# mail adapter in prod, fake in the gate) and routes operator signals through it.
gt-notify = { path = "../../domain/platform/gt-notify" }
# Real persistence adapters wired in by the bin when env URLs are set; otherwise the bin
# falls back to the in-memory port for host runs without Dolt/Postgres.
gt-store-dolt = { path = "../../kernel/gt-store-dolt" }
gt-store-pg = { path = "../../kernel/gt-store-pg" }
# `signal` (ctrl_c) is bin-only; the workspace tokio set stays minimal for the libs.
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true
# hq-mc72.12 C8 — warrant daemon decodes JSON-shaped channel messages.
serde_json.workspace = true

[dev-dependencies]
ulid.workspace = true
