[package]
name = "gt-cli"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# Rust port of the Go `gt` CLI (`internal/cmd/`, Paso 9.A / hq-hapx). Phase 1 ships the
# thin wrappers over the EXISTING backend surface only: read-side HTTP against `gt-web`
# (`/api/sessions`, `/api/beads`, `/api/stream`, `/api/nudge`) plus subprocess forwarders
# for the MCP write tools (`gt-mcp-cli`) and the `bd` issue tracker. Commands that need
# infrastructure not yet in Rust (sling/prime/done/doctor/daemon) are stubbed and name
# their blocker bead. See apps/api/docs/10-go-rust-parity.md.
[lib]
name = "gt_cli"
path = "src/lib.rs"

[[bin]]
name = "gt-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# http-only client (no TLS): the CLI talks to a town-internal gt-web over loopback. Same
# feature set proven in gt-web's dev-deps so the build stays openssl-free.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "signal", "net"] }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# `gt done` generates a ULID for the merge-submit channel-event id when one isn't supplied.
ulid = { workspace = true }

[dev-dependencies]
# Integration tests boot the real gt-web router in-process on a transient socket (the same
# harness pattern as gt-web/tests/e2e.rs) and drive the CLI's typed fetchers against it.
gt = { path = "../gt" }
gt-web = { path = "../gt-web" }
gt-agent = { path = "../../domain/lifecycle/gt-agent" }
gt-beads = { path = "../../kernel/gt-beads" }
gt-events = { path = "../../kernel/gt-events" }
gt-merge = { path = "../../domain/orchestration/gt-merge" }
gt-patrol = { path = "../../domain/orchestration/gt-patrol" }
gt-orchestration = { path = "../../domain/orchestration/gt-orchestration" }
ulid = { workspace = true }
axum = "0.7"
