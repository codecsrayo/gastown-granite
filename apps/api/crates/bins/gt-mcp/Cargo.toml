[package]
name = "gt-mcp"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# MCP server sibling of gt-web (docs/09-llm-integration.md). Exposes domain Commands as
# tools for LLM clients via the official Model Context Protocol Rust SDK (rmcp). The
# library half (registry, scope, audit, McpService) is a thin frontier on top of the
# domain actor handles; tests drive `McpService::run` directly so they cover the same
# scope/audit/dispatch path the rmcp tool router uses at runtime.
[lib]
name = "gt_mcp"
path = "src/lib.rs"

[[bin]]
name = "gt-mcp"
path = "src/main.rs"

[dependencies]
# The composition root: gt-mcp shares its agent actor instead of spawning an isolated one.
gt = { path = "../gt" }
gt-events = { path = "../../kernel/gt-events" }
gt-telemetry = { path = "../../kernel/gt-telemetry" }
gt-agent = { path = "../../domain/lifecycle/gt-agent" }
gt-scheduling = { path = "../../domain/orchestration/gt-scheduling" }
gt-merge = { path = "../../domain/orchestration/gt-merge" }
gt-patrol = { path = "../../domain/orchestration/gt-patrol" }
gt-orchestration = { path = "../../domain/orchestration/gt-orchestration" }
gt-quota = { path = "../../domain/orchestration/gt-quota" }
gt-beads = { path = "../../kernel/gt-beads" }
gt-audit = { path = "../../kernel/gt-audit" }
# Real persistence adapters: opt-in via env (GT_DOLT_URL / GT_PG_AUDIT_URL).
gt-store-dolt = { path = "../../kernel/gt-store-dolt" }
gt-store-pg = { path = "../../kernel/gt-store-pg" }

tokio = { workspace = true, features = ["io-util", "io-std", "macros", "rt", "rt-multi-thread", "sync", "net", "process"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
schemars.workspace = true
# transport-streamable-http-server adds the tower-based HTTP transport (Paso 6.f.12); stdio
# (transport-io) stays on via the workspace default features.
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
axum = "0.7"
anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync", "time"] }
# HTTP transport gate drives a real rmcp streamable-http client against the in-process server.
rmcp = { workspace = true, features = ["transport-streamable-http-client-reqwest", "client"] }
