[package]
name = "gt-mcp"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# MCP server sibling of gt-web (docs/09-llm-integration.md). Exposes domain Commands as
# tools for LLM clients via the official Model Context Protocol Rust SDK (rmcp). The
# library half (registry, scope, audit, McpService) is a thin frontier on top of the
# domain actor handles; tests drive `McpService::run` directly so they cover the same
# scope/audit/dispatch path the rmcp tool router uses at runtime.
[lib]
name = "gt_mcp"
path = "src/lib.rs"

[[bin]]
name = "gt-mcp"
path = "src/main.rs"

[dependencies]
# The composition root: gt-mcp shares its agent actor instead of spawning an isolated one.
gt = { path = "../gt" }
gt-events = { path = "../../kernel/gt-events" }
gt-agent = { path = "../../domain/gt-agent" }
gt-merge = { path = "../../domain/gt-merge" }
gt-beads = { path = "../../kernel/gt-beads" }
gt-audit = { path = "../../kernel/gt-audit" }

tokio = { workspace = true, features = ["io-util", "io-std", "macros", "rt", "rt-multi-thread", "sync"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars.workspace = true
rmcp.workspace = true
anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync"] }
