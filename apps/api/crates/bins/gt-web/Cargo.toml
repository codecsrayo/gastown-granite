[package]
name = "gt-web"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# Backend-only API + SSE for the browser frontend (docs/07-frontend.md). NOT the dashboard
# UI — that lives in apps/town under its own SvelteKit plan. The crate is the read-side
# composition root: it cables the running root's event broadcast into SSE and exposes the
# snapshot endpoints over Axum. Generic over the bead/session ports — same isolation rule
# as the rest of the workspace.
[lib]
name = "gt_web"
path = "src/lib.rs"

[[bin]]
name = "gt-web"
path = "src/main.rs"

[dependencies]
# The composition root: gt-web subscribes to its event broadcast.
gt = { path = "../gt" }
gt-audit = { path = "../../kernel/gt-audit" }
gt-beads = { path = "../../kernel/gt-beads" }
gt-events = { path = "../../kernel/gt-events" }
gt-telemetry = { path = "../../kernel/gt-telemetry" }
gt-agent = { path = "../../domain/lifecycle/gt-agent" }
gt-merge = { path = "../../domain/orchestration/gt-merge" }
gt-patrol = { path = "../../domain/orchestration/gt-patrol" }
gt-orchestration = { path = "../../domain/orchestration/gt-orchestration" }
# hq-fe-rbac.2 — unified RBAC config (shared with gt-mcp). Used by JwtIssuer to
# stamp roles/scopes onto minted tokens from a single source of truth.
gt-rbac = { path = "../../kernel/gt-rbac" }
# hq-fe-api-w.6: DELETE /api/sessions/:id wraps `gt_polecat::Tmux` for the tmux kill.
gt-polecat = { path = "../../domain/lifecycle/gt-polecat" }
# hq-fe-api-w.10: POST /api/quota/accounts/:n/{rotate,retire} dispatches QuotaCommand.
gt-quota = { path = "../../domain/orchestration/gt-quota" }
# hq-fe-auth.2: PTY login driver behind POST /api/quota/accounts/:n/login{,/token,/cancel}.
gt-login = { path = "../../domain/orchestration/gt-login" }
# hq-fe-term.2: Attach port + tmux/pty adapters for the dashboard dock-terminal WS route.
gt-terminal = { path = "../../domain/platform/gt-terminal" }
# Real persistence adapters: opt-in via env (GT_DOLT_URL / GT_PG_AUDIT_URL).
gt-store-dolt = { path = "../../kernel/gt-store-dolt" }
gt-store-pg = { path = "../../kernel/gt-store-pg" }

# `ws` enables `axum::extract::ws` for the dock-terminal upgrade (hq-fe-term.2).
axum = { version = "0.7", features = ["ws"] }
# hq-fe-cut.1 — ServeDir + ServeFile for the SvelteKit static build
# (`apps/web/build`). `fs` is the only feature we need; the SPA history fallback
# to `index.html` is wired in `lib.rs` via `ServeDir::fallback`.
tower-http = { version = "0.6", features = ["fs"] }
# `process` enables `tokio::process::Command` for `/api/worktrees` (hq-fe-api-r.8).
tokio = { workspace = true, features = ["signal", "net", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# hq-fe-rbac.1 — HS256 JWT issuer/verifier at the gateway. Single binary issues
# and verifies the same token, so symmetric is sufficient; RS256 migration is
# deferred until an external verifier (separate service / IDP) joins the trust
# boundary. `default-features = false` drops the OpenSSL/ring choice and keeps
# the build on the crate's pure-Rust default (`use_pem` off).
jsonwebtoken = { version = "9", default-features = false }
thiserror.workspace = true
# hq-fe-auth.2: ulid for `flow_id` minting + time for `quota.login_*` event timestamps.
ulid.workspace = true
time.workspace = true

[dev-dependencies]
ulid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { workspace = true, features = ["signal", "net", "macros", "rt-multi-thread"] }
# `tower::ServiceExt::oneshot` is the standard way to exercise an `axum::Router` in
# isolation without binding to a port (hq-fe-api-w.2 idempotency middleware tests).
tower = { version = "0.5", features = ["util"] }
