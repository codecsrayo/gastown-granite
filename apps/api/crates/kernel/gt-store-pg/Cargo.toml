[package]
name = "gt-store-pg"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
gt-events = { path = "../gt-events" }
gt-beads = { path = "../gt-beads" }
gt-audit = { path = "../gt-audit" }
gt-quota = { path = "../../domain/gt-quota" }
# hq-mysw: the activity projection reuses gt-feed's color/age calculator + RFC3339 parse so the
# SQL read-side and the in-memory `activity_view` share ONE threshold source of truth.
gt-feed = { path = "../../domain/gt-feed" }
tokio.workspace = true
time = { workspace = true, features = ["std", "formatting", "macros"] }
serde_json.workspace = true
# Cliente Postgres nativo: pool + runtime tokio, sin TLS (Postgres local en container).
# Consultas runtime con `sqlx::query`/`sqlx::query_as` — NO se usan los macros chequeados
# en compilación (`query!`/`query_as!`), que sí requerirían DB en build-time.
# `macros` habilita el macro `sqlx::migrate!()`, que embebe los .sql leyendo solo el
# directorio en build-time (no DB). `migrate` habilita el `Migrator` runtime.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "time", "migrate", "macros"] }
