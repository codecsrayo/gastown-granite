# gastown-rs — workspace raíz (montado bajo apps/api/).
# Pasos 0-4 de docs/08-getting-started.md: núcleo + gt-agent + audit/replay + Dolt.
# El resto de crates (más dominios, adaptadores, bins) se añaden en pasos posteriores.
[workspace]
resolver = "2"
members = [
    "crates/kernel/gt-events",
    "crates/kernel/gt-bus",
    "crates/kernel/gt-plugin",
    "crates/kernel/gt-audit",
    "crates/kernel/gt-channel",
    "crates/kernel/gt-beads",
    "crates/kernel/gt-workspace",
    "crates/kernel/gt-telemetry",
    "crates/kernel/gt-store-dolt",
    "crates/kernel/gt-store-pg",
    "crates/domain/gt-agent",
    "crates/domain/gt-scheduling",
    "crates/domain/gt-patrol",
    "crates/domain/gt-merge",
    "crates/domain/gt-quota",
    "crates/domain/gt-orchestration",
    "crates/domain/gt-feed",
    # hq-t9vt Paso 9.C — ephemeral wisp domain + reaper compaction.
    "crates/domain/gt-wisp",
    # hq-mysw Paso 9.F — Notifier PORT (operator signals: escalation / quota-block / merge-stuck).
    "crates/domain/gt-notify",
    # hq-92z9 Paso 9.D role crates — scaffolding pass; behavior fills in subsequent commits.
    "crates/domain/gt-mayor",
    "crates/domain/gt-witness",
    "crates/domain/gt-refinery",
    "crates/domain/gt-deacon",
    "crates/domain/gt-sheriff",
    # hq-63az Paso 9.E — polecat/crew/daemon lifecycle + GT_HOOK_BEAD hooks.
    "crates/domain/gt-polecat",
    "crates/bins/gt",
    "crates/bins/gt-web",
    "crates/bins/gt-mcp",
    "crates/bins/gt-cli",
    "crates/bins/gt-reaper",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.75"

[workspace.dependencies]
thiserror = "2"
ulid = "1"
time = { version = "0.3", features = ["std", "formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TOML parsing for gt-mcp's per-actor scope config (JSON handled via serde_json).
toml = "0.8"
fs2 = "0.4"
# Cliente MySQL-wire para Dolt (:3307). Sin TLS (Dolt local), deps mínimas.
mysql_async = { version = "0.34", default-features = false, features = ["minimal"] }
# Async solo en los bordes (actor + supervisor). El runtime lo crean los bins, no los crates.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "fs", "time", "sync", "io-util"] }
# Cross-process file watcher: gt-channel uses it for *.event mailboxes (await MERGE_READY).
# Default backend = inotify on Linux; no polling unless explicitly requested.
notify = "6"
# JSON Schema derives for `Command` arguments — gt-mcp publishes them via rmcp.
schemars = "1"
# Official Model Context Protocol Rust SDK. gt-mcp uses the stdio transport, server
# feature flag, and procedural macros; other crates do not pull this in.
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
anyhow = "1"
# `gt-plugin` carve-out: heterogeneous observer plugins resolved at runtime (watchdogs,
# sheriffs). The only kernel crate that pulls this in (`docs/01-architecture.md`).
async-trait = "0.1"
# Content hashing for plugin directory drift detection (gt-plugin::sync).
sha2 = "0.10"
# Filesystem fixtures for plugin scanner / sync integration tests.
tempfile = "3"

# Perfil dev rápido (sin requerir mold/lld para que compile en cualquier host).
[profile.dev]
opt-level = 0
debug = 1
